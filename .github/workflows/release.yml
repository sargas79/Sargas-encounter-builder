name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0); created on the current commit if it does not exist"
        required: true
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run build
      - name: Stamp version and download URL from the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" --arg tag "$TAG" \
            '.version = $v | .download = "https://github.com/sargas79/Sargas-encounter-builder/releases/download/\($tag)/pf2e-encounter-builder.zip"' \
            module.json > module.json.tmp && mv module.json.tmp module.json
          cat module.json
      - name: Package module
        run: |
          mkdir -p package/pf2e-encounter-builder
          cp -r module.json dist lang styles templates LICENSE LICENSE-ORC.md README.md package/pf2e-encounter-builder/
          (cd package && zip -r ../pf2e-encounter-builder.zip pf2e-encounter-builder)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            pf2e-encounter-builder.zip
            module.json
